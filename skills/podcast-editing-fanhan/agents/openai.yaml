interface:
  display_name: "播客剪辑@泛函"
  short_description: "通过 ChatCut 剪播客、去口癖和调整停顿，保留原意并逐处记录，支持核对与恢复"
  default_prompt: "用 $podcast-editing-fanhan 把这期录音剪成自然连贯的音频播客，并交付逐处核对记录。"
dependencies:
  tools:
    - type: "mcp"
      value: "chatcut"
      description: "已配置并授权的 ChatCut hosted MCP；登录与参数按当前官方插件说明"
      transport: "streamable_http"
      url: "https://api.chatcut.io/api/external-mcp/mcp"
policy:
  allow_implicit_invocation: true
